# PostgreSQL local para desarrollo. Lee usuario/contraseña de .env (no versionado).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USERNAME:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en backend/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - marketplace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  marketplace-pgdata:
